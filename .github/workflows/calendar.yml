# Every hour: rewrite cal/<memberId>.ics from the live plan, commit only if something changed.
name: Kalender
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar
jobs:
  update:
    runs-on: ubuntu-24.04  # Playwright 1.56.1 has no chromium for ubuntu-26.04 (ubuntu-latest since 2026-11-09)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/calendar.mjs
      - run: |
          git add cal
          git diff --cached --quiet && exit 0
          git -c user.name='B-gjengen kalender' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Oppdater kalendere'
          git push
